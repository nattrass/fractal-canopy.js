name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # vitest 4 / vite 8 (and their rolldown dependency) require Node
        # >=20.19 or >=22.12 to run — Node 18 works fine for consumers of the
        # published dist/ output (see package.json "engines"), but can't run
        # this repo's own dev/test toolchain.
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
