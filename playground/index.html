<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>fractal-canopy.js playground</title>
    <link rel="stylesheet" href="playground.css">
</head>
<body>
    <header>
        <h1>fractal-canopy.js</h1>
        <p>Live playground &mdash; every <code>CanopyOptions</code> field, adjustable in real time.</p>
    </header>

    <main>
        <section id="stage">
            <div id="canvasWrap">
                <canvas id="canopy" width="800" height="400"></canvas>
            </div>
            <div id="zoomControls">
                <button type="button" id="zoomOut" aria-label="Zoom out">&minus;</button>
                <button type="button" id="zoomReset" aria-label="Reset zoom" title="Reset zoom">100%</button>
                <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
            </div>
            <p id="fitNotice" role="status" aria-live="polite"></p>
        </section>

        <aside id="panel">
            <div id="identityField">
                <div class="field">
                    <label for="preset">Preset</label>
                    <select id="preset"></select>
                </div>
                <div class="field">
                    <label for="seed">Seed</label>
                    <div class="seed-row">
                        <input type="text" id="seed" placeholder="random" autocomplete="off" spellcheck="false">
                        <button type="button" id="newSeed">New seed</button>
                    </div>
                </div>
            </div>

            <form id="controls"></form>

            <div id="actions">
                <button type="button" id="randomise">Randomise</button>
                <button type="button" id="reset">Reset to defaults</button>
                <button type="button" id="download">Download PNG</button>
                <button type="button" id="copy">Copy config</button>
                <button type="button" id="copyLink">Copy link</button>
            </div>
            <p id="status" role="status" aria-live="polite"></p>
        </aside>
    </main>

    <script src="../dist/fractal-canopy.min.js"></script>
    <script src="playground.js"></script>
</body>
</html>
